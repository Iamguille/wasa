name: Despliegue a VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizando VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Entrar a la carpeta del proyecto
            cd ${{ secrets.PROJECT_PATH }}
            
            # Descargar los cambios nuevos desde GitHub
            git pull origin main
            
            # Apagar los contenedores viejos
            docker compose down
            
            # Reconstruir y encender los nuevos (en segundo plano)
            docker compose up -d --build
            
            # (Opcional) Borrar imágenes viejas que ya no sirven para ahorrar espacio
            docker image prune -f
